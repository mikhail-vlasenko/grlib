[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grlib"
version = "1.0.12"
description = "Gesture recognition library for Python"
readme = "README.md"
authors = [
    { name = "Jan Warchocki", email = "j.warchocki@student.tudelft.nl" },
    { name = "Mikhail Vlasenko", email = "m.vlasenko@student.tudelft.nl" }
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9"
]
dependencies = [
    "numpy>=1.21.4,<1.22",
    "pandas>=1.3.4,<1.4",
    "mediapipe==0.10.21",
    "scikit-learn>=1.2.2,<1.3",
    "opencv-contrib-python>=4.5.4.50,<4.6",
    "imutils>=0.5.4,<0.6",
    "natsort>=8.3.1,<8.4"
]
requires-python = ">=3.9,<3.10"

[project.urls]
Homepage = "https://github.com/mikhail-vlasenko/grlib"
